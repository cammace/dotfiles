# Prefix
set -g prefix C-b

# Enable Mouse for Termius tapping
set -g mouse on

# Notifications
set -g monitor-activity on
set -g visual-activity off
set -g bell-action any

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Performance and compatibility
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -sg escape-time 10
set -g history-limit 50000
set -g focus-events on
# set -g base-index 1        # Disabled: conflicts with claude-squad send-keys
# set -g pane-base-index 1   # Disabled: conflicts with claude-squad send-keys
set -g renumber-windows on
set -g aggressive-resize on

# Mobile-friendly: prefix-free navigation (Alt+arrows in Termius toolbar)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Mobile-friendly: prefix-free window switching
bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-n next-window
bind -n M-p previous-window

# Mobile-friendly: longer display times for small screens
set -g display-time 3000
set -g display-panes-time 3000

# Mobile-friendly: compact status bar
set -g status-left-length 20
set -g status-right-length 40

# Nord theme (no patched fonts for Termius compatibility)
set -g @nord_tmux_no_patched_font "1"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'nordtheme/tmux'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Resurrect & Continuum
set -g @resurrect-capture-pane-contents 'on'
# set -g @resurrect-processes 'claude'  # Disabled: conflicts with claude-squad session management
# set -g @continuum-restore 'on'  # Disabled: auto-restore conflicts with claude-squad
set -g @continuum-save-interval '15'

# Save on detach
# set-hook -g client-detached 'run-shell ~/.tmux/plugins/tmux-resurrect/scripts/save.sh'  # Disabled: fires on claude-squad detach

# MUST be before custom overrides
run '~/.tmux/plugins/tpm/tpm'

# Custom splits — after TPM so they override pain-control's h binding
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
